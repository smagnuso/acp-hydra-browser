name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg reports. A platform-specific break is the thing this
      # matrix exists to find, so one red cell must not cancel the run
      # that would have shown whether it is platform- or version-shaped.
      fail-fast: false
      matrix:
        # Node 20 is the floor `engines` claims, so it is tested everywhere
        # that floor is claimed rather than on POSIX alone. Windows is
        # where a version-specific difference in fs or child_process would
        # otherwise surface unseen.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The npm bundled with Node 20 and 22 (10.8.2 / 10.9.8) can die here
      # with "Exit handler never called!" on these lockfiles. On Node 22 it
      # exits 1; on Node 20 it exits 0 having installed nothing, so the
      # step passes and the next one silently runs against an empty
      # node_modules. npm 11 installs it in seconds.
      - run: npm install -g npm@11
      - run: npm ci
      # Through the package script, never a bare `npx tsc`: with
      # node_modules missing or incomplete, npx does not fail, it downloads
      # the unrelated `tsc` package off the registry and runs that instead.
      - run: npm run lint
      - run: npm run build
      - run: npm test

  # The single check branch protection requires. Do not rename it.
  #
  # The matrix jobs are named from their own matrix values
  # (`ubuntu-latest / node 20`, ...), so requiring those names directly
  # means the required list stops matching the moment the matrix changes,
  # and the gate silently stops gating. One stable name that the matrix
  # feeds into cannot drift that way.
  all-checks:
    name: all-checks
    runs-on: ubuntu-latest
    needs: test
    # always(), so this still runs when a matrix leg fails. Without it the
    # job is skipped instead, and a skipped check does not reliably block
    # a merge — it would report success by absence.
    if: always()
    steps:
      # `needs.test.result` is the whole matrix collapsed to one value:
      # success only if every leg succeeded, so this covers failure,
      # cancellation and skips alike.
      - name: Require every matrix leg to have passed
        if: needs.test.result != 'success'
        run: |
          echo "matrix result: ${{ needs.test.result }}"
          exit 1
      - run: echo "all matrix legs passed"
